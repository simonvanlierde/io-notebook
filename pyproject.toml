[project]
name = "io-notebook"
version = "0.1.0"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "marimo>=0.25.1",
    "numpy>=2.5.4"  # the floor is the numpy that Pyodide ships to the browser
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint.per-file-ignores]
"io_leontief.py" = ["PLR1711"]  # marimo writes an explicit return at the end of every cell
