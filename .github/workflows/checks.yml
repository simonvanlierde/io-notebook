name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run --isolated --resolution lowest-direct pytest # the numpy floor the browser runs
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run marimo check io_leontief.py

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv run marimo export html-wasm io_leontief.py -o dist --mode run
      - run: rm -f dist/CLAUDE.md # marimo bundles its assistant prompt into the export; not part of the page
      - name: Smoke-test the export in Chromium
        run: |
          uv run --with playwright playwright install --with-deps chromium
          python3 -m http.server --bind 127.0.0.1 8000 --directory dist &
          for _ in $(seq 30); do curl -fsS -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          curl -fsS -o /dev/null http://127.0.0.1:8000/ # fail here, not in Chromium, if the server never came up
          uv run --with playwright python scripts/check_wasm.py http://127.0.0.1:8000/ "$RUNNER_TEMP/shot.png"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist

  deploy:
    needs: [checks, wasm]
    # NOTE: off by default; set the repo variable DEPLOY_PAGES=true and the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to enable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the Pages project on the first run
        run: npx --yes wrangler@4.147.0 pages project list | grep -qw io-notebook || npx --yes wrangler@4.147.0 pages project create io-notebook --production-branch main
      - run: npx --yes wrangler@4.147.0 pages deploy dist --project-name io-notebook --branch main
