name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run --isolated --resolution lowest-direct pytest # the numpy floor the browser runs
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run marimo check io_leontief.py

  deploy:
    needs: checks
    # NOTE: off until the RaMa-Scene harness and explorer are public; set the repo variable DEPLOY_PAGES=true to enable
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_PAGES == 'true'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv run marimo export html-wasm io_leontief.py -o dist --mode run
      - run: rm -f dist/CLAUDE.md # marimo bundles its assistant prompt into the export; not part of the page
      - name: Smoke-test the export in Chromium
        run: |
          uv run --with playwright playwright install --with-deps chromium
          python3 -m http.server --bind 127.0.0.1 8000 --directory dist &
          uv run --with playwright python scripts/check_wasm.py http://127.0.0.1:8000/ "$RUNNER_TEMP/shot.png"
      - name: Create the Pages project on the first run
        run: npx --yes wrangler@4 pages project list | grep -qw io-notebook || npx --yes wrangler@4 pages project create io-notebook --production-branch main
      - run: npx --yes wrangler@4 pages deploy dist --project-name io-notebook --branch main
