name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run --isolated --resolution lowest-direct pytest  # the numpy floor the browser runs
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run marimo check io_leontief.py
