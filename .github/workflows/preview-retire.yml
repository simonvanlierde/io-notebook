name: Retire preview

# Wrangler cannot delete a preview alias, so a PR that closes or turns draft
# gets its alias pointed at a short "preview closed" page instead. Run it by
# hand with a list of PR numbers to retire older previews.
on:
  pull_request:
    types: [closed, converted_to_draft]
  workflow_dispatch:
    inputs:
      prs:
        description: PR numbers to retire, separated by spaces
        required: true

permissions:
  contents: read

concurrency:
  group: preview-${{ github.event.pull_request.number || github.run_id }}

jobs:
  retire:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up pnpm and Node.js
        uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3
        with:
          version: 11.10.0 # no package.json here to name it
          runtime: node@26
          install: false

      - name: Point each alias at the closed page
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PRS: ${{ github.event.pull_request.number || inputs.prs }}
        run: |
          mkdir retired
          printf '/*\n  X-Robots-Tag: noindex\n' > retired/_headers
          echo '<!doctype html><title>Preview closed</title><p>This pull request preview is closed. See <a href="https://simonvanlierde.com/io-notebook/">the notebook</a>.</p>' > retired/index.html
          cp retired/index.html retired/404.html
          for pr in $PRS; do
            case "$pr" in *[!0-9]*|'') echo "::error::Not a PR number: $pr"; exit 1 ;; esac
            pnpm dlx wrangler@4.150.0 versions upload --assets retired --preview-alias "pr-$pr" --message "PR $pr closed"
            echo "Retired pr-$pr" >> "$GITHUB_STEP_SUMMARY"
          done
